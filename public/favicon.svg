<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="zebraRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a35"/>
      <stop offset="100%" stop-color="#e0122b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#ff1a35" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ff1a35" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Iconic Z with aggressive speed cuts -->
  <g filter="url(#glow)">
    <path fill="url(#zebraRed)" d="
      M 100 110 
      L 412 110 
      L 412 176 
      L 220 348 
      L 412 348 
      L 412 414 
      L 100 414 
      L 100 348 
      L 292 176 
      L 100 176 
      Z
    "/>
    <!-- Zebra signature horizontal stripes in the cutouts -->
    <rect x="100" y="218" width="65" height="24" rx="4" fill="url(#zebraRed)" />
    <rect x="100" y="270" width="65" height="24" rx="4" fill="url(#zebraRed)" />
  </g>
</svg>
